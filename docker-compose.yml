# Base de datos del proyecto en Docker (independiente del MySQL instalado en la PC).
# Uso:
#   docker compose up -d        → levanta MySQL (puerto 3307) y Adminer (http://localhost:8080)
#   docker compose down         → detiene los contenedores (los datos se conservan)
#   docker compose down -v      → detiene y BORRA los datos
#
# Las credenciales por defecto son solo para desarrollo local.
# Para cambiarlas, crea un archivo .env en la raíz con estas variables.

name: seguridad-ves

services:
  mysql:
    image: mysql:8.4
    container_name: seguridad-ves-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ves_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seguridad_ves}
      MYSQL_USER: ${MYSQL_USER:-ves_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ves_app_2026}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer:4.8.1
    container_name: seguridad-ves-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  mysql_data:
